[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verimorph"
version = "0.1.0"
description = "Bounded, transactional and auditable self-modifying programs"
requires-python = ">=3.11,<3.15"
license = "LicenseRef-Proprietary"
authors = [{name = "Stamatis-Christos Saridakis"}]
dependencies = []
readme = "README.md"

[project.optional-dependencies]
dev = ["setuptools>=75", "wheel>=0.45", "pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.12,<1", "mypy>=1.15,<3", "coverage>=7,<8", "build>=1,<2", "pip-audit>=2,<3"]

[project.scripts]
verimorph = "verimorph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verimorph = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/verimorph"]

[tool.coverage.run]
source = ["verimorph"]
branch = true

[tool.coverage.report]
show_missing = true
