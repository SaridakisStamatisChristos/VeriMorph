name: verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - python: '3.12'
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python scripts/verify.py
      - name: Dependency audit
        run: python -m pip_audit -r requirements-dev.lock --disable-pip
      - name: Historical reproduction
        run: python scripts/reproduce_legacy.py
      - name: Deterministic CLI evidence
        run: |
          verimorph evolve examples/evolve.vm --seed 42 --ledger ci-run.jsonl
          verimorph replay ci-run.jsonl
          verimorph replay docs/evidence/seed42.jsonl
